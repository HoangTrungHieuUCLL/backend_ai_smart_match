services:
  db:
    image: postgres:16-alpine
    container_name: ai_smart_match_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_smart_match
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_smart_match"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ai_smart_match_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_smart_match
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend_ai_smart_match_team19
    container_name: ai_smart_match_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend_ai_smart_match_team19:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

  ai:
    build:
      context: ./AI-backend
    container_name: ai_smart_match_ai
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: AIzaSyB2hRqKGNxU_tfweqdOuGuH43Ih6brLerI
    ports:
      - "8001:8001"
    volumes:
      - ./AI-backend:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001

volumes:
  pgdata:
  frontend_node_modules:
